[project]
name = "footnote-core"
version = "0.1.0"
description = "Footnote backend: local realtime debate fact checking pipeline and API"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Azra Hudaya" }]
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
footnote = "footnote.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footnote"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: pipeline integration tests",
    "gpu: requires CUDA GPU",
    "network: requires external network",
]
addopts = "-m 'not integration and not gpu and not network'"
