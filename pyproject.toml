[tool.uv.workspace]
members = ["services/core"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/core/src", "services/core/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PTH", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"services/core/tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "services/core/src"
